# Summary of design parameters for cycpep_Kelch

target:
  name: "Keap1 Kelch domain"
  pdb: "3WN7"
  chain: "A"

hotspots:
  HS1: "hotspots_HS1.txt"   # 27 surface / classic Nrf2-binding pocket residues, used for the initial design
  HS2: "hotspots_HS2.txt"   # 18 deep-pocket residues, used for the binding-depth remodeling validation

lengths:
  HS1_stage1: [8, 9, 10, 11, 12, 13, 14, 15]   # length-trend exploration
  HS1_production: [8, 9, 10]                    # focus range after the trend conclusion
  HS2_validation: [8, 9, 10, 11]                # deep-hotspot validation range
  BoltzGen: [10, 11, 12]                        # backbone-sequence joint generation range

rfdiffusion:
  denoising_noise: 1
  checkpoints: ["complex_base_ckpt", "complex_beta_ckpt"]
  note: "8-9 backbones per length were screened into the downstream stages; the exact contig/hotspot command lines are not available and the flags still need to be added."

proteinmpnn:
  note: "Multiple sequences were generated per backbone and the best global_score / lowest-scoring sequences were passed to AF3; 5000 sequences were generated per backbone."

alphafold3:
  metric: "ipTM"
  local_seed: 42378           
  num_samples: 5               
  server: "https://alphafoldserver.com/"
  note: "Initial screening threshold is roughly ipTM >= 0.72~0.75"

rosetta:
  relax_command: "mpirun -np 10 rosetta_scripts.mpi.linuxgccrelease @flags_cycpep_target_relax"
  score_command: "mpirun -np 50 score_jd2.mpi.linuxgccrelease @flags_evaluaton_cycpep"
  relax_models_per_candidate: 1000
  metrics: ["ddG", "contact_molecular_surface", "RMSD-ddg energy funnel"]

simple_cycpep_predict:
  sampling_command: "mpirun -np 25 simple_cycpep_predict.mpi.linuxgccrelease @flags_simple_cycpep_predict"
  score_command: "mpirun -np 50 score_jd2.mpi.linuxgccrelease @flags_score_jd2"
  models_per_peptide: 5000
  purpose: "Free-state conformational sampling, compared with the AF3 bound-state conformation to assess conformational pre-organization"
